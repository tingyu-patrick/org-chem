<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="100%" height="auto" style="background:#ffffff; font-family:'Segoe UI',Arial,sans-serif;">

  <defs>
    <marker id="el-arrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1 L7,4 L0,7 L1.8,4 Z" fill="#dc2626"/>
    </marker>
    <marker id="fishhook" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,4.5 L7,4.5 L1.5,1 Z" fill="#dc2626"/>
    </marker>
    <marker id="rxn-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1.2 L8,4.5 L0,7.8 L1.8,4.5 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="976" height="356" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="2" y="2" width="976" height="34" rx="10" fill="#f8fafc"/>  <line x1="2" y1="36" x2="978" y2="36" stroke="#e2e8f0" stroke-width="1"/>  <text x="18" y="24" font-size="14" font-weight="700" fill="#0f172a">16. Alcohols → Alkyl Halides (Ch10): HX (SN1/SN2), SOCl2/py (SN2), PBr3 (SN2), DAST/HF</text>
  <rect x="12" y="48" width="308" height="294" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="66" font-size="12" font-weight="700" fill="#334155">16A. 3° R–OH + HX (SN1 via Carbocation)</text>
  <rect x="334" y="48" width="312" height="294" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="344" y="66" font-size="12" font-weight="700" fill="#334155">16B. 1°/2° R–OH + SOCl2 / Pyridine (SN2)</text>
  <rect x="660" y="48" width="308" height="294" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="670" y="66" font-size="12" font-weight="700" fill="#334155">16C. 1°/2° R–OH + PBr3 (SN2) &amp; 16D. R–F</text>
  <text x="165.0" y="105.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">R3C—OH  +  H—X  ⇌  R3C—OH2⁺ + X⁻</text>
  <line x1="165.0" y1="120.0" x2="165.0" y2="160.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="165.0" y="132.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">-H2O (RDS)</text>
  <text x="165.0" y="182.0" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">R3C⁺ (3° Carbocation)  +  :X⁻</text>
  <line x1="165.0" y1="196.0" x2="165.0" y2="236.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="165.0" y="208.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">fast</text>
  <text x="165.0" y="258.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">R3C—X  (SN1: fast for 3° alcohols)</text>
  <text x="165.0" y="295.0" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">*1° alcohols react with HBr via back-side SN2</text>
  <text x="165.0" y="315.0" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">*2° alcohols + HX suffer rearrangement</text>
  <text x="490.0" y="98.0" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">R—OH + SOCl2 + py  →  R—O—S(=O)—Cl</text>
  <text x="490.0" y="118.0" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">(Alkyl chlorosulfite: good leaving group)</text>
  <line x1="450.0" y1="195.0" x2="515.0" y2="195.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="515.0" y1="195.0" x2="570.0" y2="195.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="372.6" y="182.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="390.0" y="200.0" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">:Cl⁻</text>
  <rect x="432.6" y="182.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="450.0" y="200.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">C(R)</text>
  <rect x="507.0" y="182.0" width="16.0" height="19.0" fill="#ffffff" rx="3"/>
  <text x="515.0" y="200.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">O</text>
  <rect x="547.5" y="182.0" width="60.9" height="19.0" fill="#ffffff" rx="3"/>
  <text x="578.0" y="200.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">S(=O)Cl</text>
  <path d="M 408.0,188.0 Q 425.0,165.0 442.0,184.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <path d="M 482.0,190.0 Q 502.0,162.0 545.0,182.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <text x="490.0" y="255.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">→  Cl—C(R) [100% Inversion] + SO2↑ + Cl⁻</text>
  <text x="490.0" y="295.0" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">SN2: No rearrangement! Ethers, carbonyls</text>
  <text x="490.0" y="315.0" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">&amp; aromatic rings don&#x27;t interfere.</text>
  <text x="814.0" y="98.0" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">R—OH + PBr3  →  R—O⁺(H)—PBr2 + :Br⁻</text>
  <line x1="775.0" y1="175.0" x2="845.0" y2="175.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="697.6" y="162.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="715.0" y="180.0" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">:Br⁻</text>
  <rect x="757.6" y="162.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="775.0" y="180.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">C(R)</text>
  <rect x="815.9" y="162.0" width="78.3" height="19.0" fill="#ffffff" rx="3"/>
  <text x="855.0" y="180.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">⁺O(H)PBr2</text>
  <path d="M 732.0,168.0 Q 750.0,145.0 766.0,164.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <path d="M 805.0,170.0 Q 825.0,142.0 842.0,162.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <text x="814.0" y="225.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">→  Br—C(R) [SN2 Inversion] + HOPBr2</text>
  <text x="814.0" y="275.0" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">16D. Alkyl Fluorides (R–F):</text>
  <text x="814.0" y="298.0" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">R–OH + [(CH3CH2)2NSF3] (DAST)</text>
  <text x="814.0" y="318.0" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">or HF / Pyridine  →  R–F ( up to 99% )</text>
</svg>
