<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="100%" height="auto" style="background:#ffffff; font-family:'Segoe UI',Arial,sans-serif;">

  <defs>
    <marker id="el-arrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1 L7,4 L0,7 L1.8,4 Z" fill="#dc2626"/>
    </marker>
    <marker id="fishhook" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,4.5 L7,4.5 L1.5,1 Z" fill="#dc2626"/>
    </marker>
    <marker id="rxn-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1.2 L8,4.5 L0,7.8 L1.8,4.5 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="976" height="316" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="2" y="2" width="976" height="34" rx="10" fill="#f8fafc"/>  <line x1="2" y1="36" x2="978" y2="36" stroke="#e2e8f0" stroke-width="1"/>  <text x="18" y="24" font-size="14" font-weight="700" fill="#0f172a">13. KMnO4 Oxidative Cleavage (KMnO4, H3O⁺): Cyclic Manganate &amp; Overoxidation</text>
  <rect x="16" y="48" width="310" height="254" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="26" y="66" font-size="12" font-weight="700" fill="#334155">Step 1: [3+2] → Cyclic Manganate(V)</text>
  <rect x="344" y="48" width="305" height="254" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="354" y="66" font-size="12" font-weight="700" fill="#334155">Step 2: C–C Oxidative Cleavage</text>
  <rect x="668" y="48" width="296" height="254" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="678" y="66" font-size="12" font-weight="700" fill="#334155">Step 3: Overoxidation of C–H &amp; =CH2</text>
  <line x1="125.0" y1="215.0" x2="215.0" y2="215.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="125.0" y1="215.0" x2="125.0" y2="155.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="117.0" y="135.0" width="16.0" height="19.0" fill="#ffffff" rx="3"/>
  <text x="125.0" y="153.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">O</text>
  <line x1="215.0" y1="215.0" x2="215.0" y2="155.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="207.0" y="135.0" width="16.0" height="19.0" fill="#ffffff" rx="3"/>
  <text x="215.0" y="153.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">O</text>
  <line x1="125.0" y1="145.0" x2="170.0" y2="105.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="215.0" y1="145.0" x2="170.0" y2="105.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="148.2" y="89.0" width="43.5" height="19.0" fill="#ffffff" rx="3"/>
  <text x="170.0" y="107.0" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">MnO2⁻</text>
  <rect x="112.0" y="202.0" width="26.1" height="19.0" fill="#ffffff" rx="3"/>
  <text x="125.0" y="220.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">R2C</text>
  <rect x="197.6" y="202.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="215.0" y="220.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">CHR&#x27;</text>
  <path d="M 170.0,215.0 Q 142.0,192.0 128.0,178.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <path d="M 195.0,128.0 Q 202.0,105.0 182.0,102.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <path d="M 215.0,185.0 Q 232.0,175.0 218.0,162.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <text x="170.0" y="275.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">5-Membered Cyclic Manganate Ester</text>
  <line x1="318.0" y1="175.0" x2="354.0" y2="175.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="336.0" y="167.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">H3O⁺</text>
  <text x="495.0" y="145.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">R2C = O   (Ketone stays)</text>
  <text x="495.0" y="180.0" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">+</text>
  <text x="495.0" y="215.0" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">[ R&#x27;CH = O ]  (Aldehyde intermediate)</text>
  <text x="495.0" y="275.0" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Aldehyde is immediately oxidized further!</text>
  <line x1="640.0" y1="175.0" x2="678.0" y2="175.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="659.0" y="167.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">KMnO4/H3O⁺</text>
  <text x="815.0" y="135.0" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">=CHR&#x27;  →  R&#x27;—COOH (Carboxylic acid)</text>
  <text x="815.0" y="185.0" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">=CH2   →  [H2C=O] → CO2↑ + H2O</text>
  <text x="815.0" y="235.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">=CR2   →  R2C=O (Ketone)</text>
  <text x="815.0" y="280.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Overoxidizes vinylic C–H bonds</text>
</svg>
