<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="auto" style="background:#ffffff; font-family:'Segoe UI',Arial,sans-serif;">

  <defs>
    <marker id="el-arrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1 L7,4 L0,7 L1.8,4 Z" fill="#dc2626"/>
    </marker>
    <marker id="fishhook" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,4.5 L7,4.5 L1.5,1 Z" fill="#dc2626"/>
    </marker>
    <marker id="rxn-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,1.2 L8,4.5 L0,7.8 L1.8,4.5 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="976" height="336" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="2" y="2" width="976" height="34" rx="10" fill="#f8fafc"/>  <line x1="2" y1="36" x2="978" y2="36" stroke="#e2e8f0" stroke-width="1"/>  <text x="18" y="24" font-size="14" font-weight="700" fill="#0f172a">15. Allylic Bromination with NBS (Ch10): Radical Chain &amp; Resonance Stabilization</text>
  <rect x="12" y="48" width="235" height="274" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="66" font-size="12" font-weight="700" fill="#334155">1. Initiation &amp; Allylic H Abstraction</text>
  <rect x="258" y="48" width="255" height="274" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="268" y="66" font-size="12" font-weight="700" fill="#334155">2. Resonance-Stabilized Allylic Radical</text>
  <rect x="524" y="48" width="215" height="274" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="534" y="66" font-size="12" font-weight="700" fill="#334155">3. NBS Role: Low [Br2] Supply</text>
  <rect x="750" y="48" width="218" height="274" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="760" y="66" font-size="12" font-weight="700" fill="#334155">4. Propagation Step 2 → Product</text>
  <line x1="45.0" y1="178.2" x2="95.0" y2="178.2" stroke="#0f172a" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="45.0" y1="171.8" x2="95.0" y2="171.8" stroke="#0f172a" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="95.0" y1="175.0" x2="145.0" y2="175.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="145.0" y1="175.0" x2="145.0" y2="115.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="32.0" y="162.0" width="26.1" height="19.0" fill="#ffffff" rx="3"/>
  <text x="45.0" y="180.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">CH2</text>
  <rect x="86.3" y="162.0" width="17.4" height="19.0" fill="#ffffff" rx="3"/>
  <text x="95.0" y="180.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">CH</text>
  <rect x="131.9" y="162.0" width="26.1" height="19.0" fill="#ffffff" rx="3"/>
  <text x="145.0" y="180.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">CHR</text>
  <rect x="137.0" y="92.0" width="16.0" height="19.0" fill="#ffffff" rx="3"/>
  <text x="145.0" y="110.0" font-size="15" font-weight="700" fill="#0284c7" text-anchor="middle">H</text>
  <rect x="187.6" y="92.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="205.0" y="110.0" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">•Br:</text>
  <path d="M 145.0,145.0 Q 120.0,152.0 138.0,165.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#fishhook)"/>
  <path d="M 148.0,132.0 Q 165.0,92.0 172.0,102.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#fishhook)"/>
  <path d="M 195.0,102.0 Q 182.0,92.0 176.0,102.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#fishhook)"/>
  <text x="128.0" y="255.0" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Allylic C–H BDE is lowest</text>
  <text x="128.0" y="278.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">(~364 kJ/mol vs 410 alkyl)</text>
  <text x="385.0" y="130.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">CH2 = CH — C•H—R</text>
  <text x="385.0" y="162.0" font-size="18" font-weight="800" fill="#0284c7" text-anchor="middle">⟷</text>
  <text x="385.0" y="195.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">•CH2 — CH = CH—R</text>
  <text x="385.0" y="245.0" font-size="12" font-weight="600" fill="#0284c7" text-anchor="middle">Unpaired e⁻ delocalized over</text>
  <text x="385.0" y="268.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">allylic π system (never forms on</text>
  <text x="385.0" y="288.0" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">vinylic or unactivated alkyl C)</text>
  <text x="632.0" y="135.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">NBS  +  H—Br</text>
  <line x1="632.0" y1="152.0" x2="632.0" y2="192.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="632.0" y="164.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">ionic</text>
  <text x="632.0" y="215.0" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">Succinimide + Br2 (trace)</text>
  <text x="632.0" y="262.0" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Keeps [Br2] &amp; [HBr] very low</text>
  <text x="632.0" y="284.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">to prevent C=C ionic addition!</text>
  <text x="858.0" y="135.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Allylic•  +  Br—Br</text>
  <line x1="858.0" y1="152.0" x2="858.0" y2="192.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="858.0" y="164.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">fishhooks</text>
  <text x="858.0" y="215.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">CH2=CH—CH(Br)R + •Br</text>
  <text x="858.0" y="268.0" font-size="12" font-weight="600" fill="#0284c7" text-anchor="middle">Regenerates •Br chain carrier</text>
</svg>
