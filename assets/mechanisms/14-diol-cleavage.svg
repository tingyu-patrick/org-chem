  <line x1="445.0" y1="220.0" x2="515.0" y2="220.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="507.0" y="207.0" width="16.0" height="19.0" fill="#ffffff" rx="3"/>
  <text x="515.0" y="225.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">O</text>
  <line x1="515.0" y1="140.0" x2="565.0" y2="180.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="515.0" y1="220.0" x2="565.0" y2="180.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="540.2" y="167.0" width="69.6" height="19.0" fill="#ffffff" rx="3"/>
  <text x="575.0" y="185.0" font-size="15" font-weight="700" fill="#0284c7" text-anchor="middle">I(=O)2OH</text>
  <rect x="431.9" y="127.0" width="26.1" height="19.0" fill="#ffffff" rx="3"/>
  <text x="445.0" y="145.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">R2C</text>
  <rect x="427.6" y="207.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="445.0" y="225.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">R&#x27;2C</text>
  <path d="M 445.0,180.0 Q 475.0,205.0 488.0,216.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <path d="M 538.0,205.0 Q 562.0,205.0 562.0,190.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <path d="M 538.0,155.0 Q 502.0,122.0 482.0,136.0" fill="none" stroke="#dc2626" stroke-width="1.9" marker-end="url(#el-arrow)"/>
  <text x="508.0" y="275.0" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Cyclic Periodate Ester cleaves C–C bond</text>
  <line x1="658.0" y1="175.0" x2="694.0" y2="175.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#rxn-arrow)"/>
  <text x="825.0" y="140.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">R2C = O</text>
  <text x="825.0" y="175.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">+   R&#x27;2C = O</text>
  <text x="825.0" y="215.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">+   HIO3 [I(V)]</text>
  <text x="825.0" y="278.0" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Converts 1,2-diol into 2 carbonyls</text>
