  <rect x="2" y="2" width="976" height="316" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="2" y="2" width="976" height="34" rx="10" fill="#f8fafc"/>  <line x1="2" y1="36" x2="978" y2="36" stroke="#e2e8f0" stroke-width="1"/>  <text x="18" y="24" font-size="14" font-weight="700" fill="#0f172a">14. Periodate Cleavage of 1,2-Diols (HIO4, H2O): Cyclic Periodate Ester</text>
  <rect x="16" y="48" width="315" height="254" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
