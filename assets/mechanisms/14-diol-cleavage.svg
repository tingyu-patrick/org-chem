  <line x1="110.0" y1="215.0" x2="165.0" y2="215.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="166.3" y="202.0" width="17.4" height="19.0" fill="#ffffff" rx="3"/>
  <text x="175.0" y="220.0" font-size="15" font-weight="700" fill="#0284c7" text-anchor="middle">OH</text>
  <rect x="97.0" y="132.0" width="26.1" height="19.0" fill="#ffffff" rx="3"/>
  <text x="110.0" y="150.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">R2C</text>
  <rect x="92.6" y="202.0" width="34.8" height="19.0" fill="#ffffff" rx="3"/>
  <text x="110.0" y="220.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">R&#x27;2C</text>
  <text x="255.0" y="180.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">+  HIO4</text>
  <text x="175.0" y="275.0" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Diol OH groups attack I(VII) center (-H2O)</text>
