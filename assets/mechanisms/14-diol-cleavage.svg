  <text x="358" y="66" font-size="12" font-weight="700" fill="#334155">Step 2: Concerted 6-Electron Ring Cleavage</text>
  <rect x="686" y="48" width="278" height="254" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="696" y="66" font-size="12" font-weight="700" fill="#334155">Products: 2 Carbonyls + HIO3</text>
